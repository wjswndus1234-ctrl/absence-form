<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>결석신고서 – 담임교사용</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#2f5bd8;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#98a1b0;--ac:#6f93ff;--bd:#323946}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#98a1b0;--ac:#6f93ff;--bd:#323946}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px;color:var(--ac)}p.s{margin:0 0 14px;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk label{display:inline-flex;gap:6px;align-items:center;margin:4px 12px 0 0;color:var(--tx);font-size:14px}.chk input{width:auto}
button{padding:11px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-size:15px;cursor:pointer;width:100%}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);margin-top:8px}
canvas{width:100%;border:1px solid var(--bd);background:#fff;border-radius:6px}
.pad{touch-action:none;background:#fff;border:1px dashed var(--bd);border-radius:8px;cursor:crosshair;display:block}
#q button{margin-top:6px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);text-align:left}
.pv{position:sticky;top:20px;align-self:start}
</style></head><body>
<div class="wrap"><div>
<h1>결석신고서 – 담임교사용</h1><p class="s">원본 양식(PDF) 위에 글씨만 얹어서 저장합니다. 양식은 그대로예요.</p>
<div class="card"><h2>학생 제출 코드 불러오기</h2><p class="s">학생이 카톡으로 보낸 메시지를 길게 눌러 복사한 뒤 붙여넣으세요. 여러 명이면 이어서 붙여넣어도 됩니다.</p>
<textarea id="codes" rows="3" placeholder="GS1. 로 시작하는 코드"></textarea><button id="imp" type="button" style="margin-top:8px">불러오기</button>
<p class="s" id="msg" style="margin:8px 0 0"></p><div id="q"></div></div>
<div class="card"><h2>① 학생 · 학부모 작성 (불러온 내용, 수정 가능)</h2>
<div class="r"><div><label>학번</label><input id="sid" list="roster" inputmode="numeric"></div><div><label>성명</label><input id="sname"></div></div>
<label>연락처(전화)</label><input id="tel" inputmode="tel" placeholder="010-0000-0000">
<div class="r"><div><label>학생 이름</label><input id="stu"></div><div><label>학부모 이름</label><input id="par"></div></div>
<div class="r"><div><label>학생 손글씨 서명</label><canvas class="pad" id="pad_stu" width="400" height="150"></canvas><button class="g" id="clr_stu" type="button">지우기</button></div>
<div><label>학부모 손글씨 서명</label><canvas class="pad" id="pad_par" width="400" height="150"></canvas><button class="g" id="clr_par" type="button">지우기</button></div></div>
<datalist id="roster"></datalist></div>
<div class="card"><h2>② 담임교사 작성</h2>
<div class="r"><div><label>결석 시작일</label><input type="date" id="d1"></div><div><label>결석 종료일</label><input type="date" id="d2"></div></div>
<label>결석 일수 직접 입력 (비워 두면 토·일, 공휴일을 뺀 일수가 자동 입력)</label><input id="nd" inputmode="numeric"><p class="s" id="hint" style="margin:6px 0 0"></p>
<label>결석 종별</label><select id="kind"><option value="">선택 안 함</option><option>질병</option><option>인정</option><option>기타</option></select>
<label>결석사유</label><input id="why" placeholder="예) 감기 몸살로 인한 병원 진료">
<label>제출(작성) 날짜</label><input type="date" id="d3">
<label>담임 확인내용</label><div class="chk"><label><input type="checkbox" id="c1">가정방문</label><label><input type="checkbox" id="c2">전화확인</label><label><input type="checkbox" id="c3">학부모내교</label></div>
<label>담임 의견</label><textarea id="op" rows="3"></textarea>
<label>담임교사 이름</label><input id="tch"></div>
<button id="pdf">PDF로 저장</button><button class="g" id="rst">입력 초기화</button>
</div>

  SIG[k].forEach(st=>{x.beginPath();st.forEach((p,i)=>{const px=p[0]*c.width,py=p[1]*c.height;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})};

 if(dl){try{await dl.save({filename:fn,data:bytes})}catch(e){if(e&&e.code!=='declined')$('msg').textContent='저장하지 못했어요. 다시 시도해 주세요.'}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}};
$('rst').onclick=()=>{ids.forEach(i=>{if(i!='tch'&&i!='d3')$(i).value=''});['c1','c2','c3'].forEach(i=>$(i).checked=false);SIG.stu=[];SIG.par=[];PADS.stu();PADS.par();upd()};

async function dec(t){t=t.trim().replace(/^GS1\./,'').replace(/-/g,'+').replace(/_/g,'/');const b=Uint8Array.from(atob(t),c=>c.charCodeAt(0));
 const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(s).text())}
const dn=a=>(a||[]).map(f=>{const s=[];for(let i=0;i<f.length;i+=2)s.push([f[i]/1000,f[i+1]/1000]);return s});
const QUE=[];
function applyRec(o){$('sid').value=o.a||'';$('sname').value=o.b||'';$('tel').value=o.c||'';$('stu').value=o.d||'';$('par').value=o.e||'';$('d1').value=o.f||'';$('d2').value=o.g||'';$('why').value=o.h||'';
 SIG.stu=dn(o.s);SIG.par=dn(o.p);PADS.stu();PADS.par();upd()}
function renderQ(){const q=$('q');q.innerHTML='';QUE.forEach(o=>{const b=document.createElement('button');b.type='button';b.textContent=`${o.a||''}  ${o.b||''}  (불러오기)`;b.onclick=()=>applyRec(o);q.appendChild(b)})}
$('imp').onclick=async()=>{const parts=$('codes').value.split(/\s+/).filter(s=>s.startsWith('GS1.'));let bad=0,first=null;
 for(const p of parts){try{const o=await dec(p);QUE.push(o);if(!first)first=o}catch(e){bad++}}
 $('codes').value='';renderQ();if(first)applyRec(first);
 $('msg').textContent=bad?`코드 ${bad}개를 읽지 못했어요. 코드를 끝까지 복사했는지 확인해 주세요.`:(first?'불러왔어요.':'GS1.로 시작하는 코드를 찾지 못했어요.')};
pad('stu');pad('par');fillRoster();upd();
</script></body></html>
